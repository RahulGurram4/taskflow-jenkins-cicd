worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json;

  # Non-root nginx needs writable paths redirected away from the defaults
  # (which live under /var and are owned by root).
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    # Unprivileged (>1024) port so the master process never needs root.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lightweight liveness probe for the frontend container itself —
    # doesn't touch the backend, just proves nginx is serving traffic.
    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Reverse proxy to the backend service, resolved by Docker's embedded
    # DNS using the Compose service name "backend". This lets the frontend
    # call a same-origin /api path in the browser (no CORS headaches, no
    # hardcoded backend hostname baked into the JS bundle).
    location /api/ {
      proxy_pass http://backend:4000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — any unmatched route serves index.html so React Router
    # (if added later) works on hard refreshes / deep links.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
